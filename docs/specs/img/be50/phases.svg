<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Stacked horizontal bars of seconds per phase for the Intersected Extent run: the unclipped run spends 7.1 s warping, 10.0 s resampling, 13.6 s compressing and 22.3 s masking and scoring, 57 s in all; the clipped web run spends 0.3 s clipping and under 1.4 s in each later phase, 3.5 s in all. Bootstrap bars show 65 s unclipped against 16 s clipped, of which 12 s is sampling in both.">
  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#1a2233">
    <!-- axis: 0..70 s over x=200..820 (8.857 px/s) -->
    <g stroke="#1a2233" stroke-opacity=".25">
      <line x1="200" y1="40" x2="200" y2="250"/>
      <line x1="288.6" y1="40" x2="288.6" y2="250" stroke-dasharray="2 4"/>
      <line x1="377.1" y1="40" x2="377.1" y2="250" stroke-dasharray="2 4"/>
      <line x1="465.7" y1="40" x2="465.7" y2="250" stroke-dasharray="2 4"/>
      <line x1="554.3" y1="40" x2="554.3" y2="250" stroke-dasharray="2 4"/>
      <line x1="642.9" y1="40" x2="642.9" y2="250" stroke-dasharray="2 4"/>
      <line x1="731.4" y1="40" x2="731.4" y2="250" stroke-dasharray="2 4"/>
      <line x1="820" y1="40" x2="820" y2="250" stroke-dasharray="2 4"/>
    </g>
    <g font-size="11" fill-opacity=".7" text-anchor="middle">
      <text x="200" y="268">0 s</text><text x="288.6" y="268">10</text><text x="377.1" y="268">20</text><text x="465.7" y="268">30</text><text x="554.3" y="268">40</text><text x="642.9" y="268">50</text><text x="731.4" y="268">60</text><text x="820" y="268">70 s</text>
    </g>

    <!-- Row 1: Intersected Extent, no pre-clip: warp 7.1, resample 10.0, compress 13.6, pwb 0.4, mask+metrics 22.3  (total 53.4 shown; wall 56.8 incl. import) -->
    <text x="190" y="66" text-anchor="end" font-weight="600">Full Domain</text>
    <text x="190" y="81" text-anchor="end" font-size="11" fill-opacity=".7">without pre-clip</text>
    <g>
      <rect x="200" y="54" width="62.9" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="262.9" y="54" width="88.6" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="351.5" y="54" width="120.5" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="472" y="54" width="3.5" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="475.5" y="54" width="197.5" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <text x="231" y="69" font-size="10" text-anchor="middle">warp 7</text>
      <text x="307" y="69" font-size="10" text-anchor="middle">resample 10</text>
      <text x="411" y="69" font-size="10" text-anchor="middle">compress 14</text>
      <text x="574" y="69" font-size="10" text-anchor="middle">mask + score 22</text>
      <text x="680" y="69" font-weight="600">57 s</text>
    </g>

    <!-- Row 2: Intersected Extent, web (pre-clip): clip 0.3, warp .56, resample .42, compress .73, pwb .42, mask 1.22 -->
    <text x="190" y="112" text-anchor="end" font-weight="600">Full Domain</text>
    <text x="190" y="127" text-anchor="end" font-size="11" fill-opacity=".7">web app (pre-clip)</text>
    <g>
      <rect x="200" y="100" width="2.7" height="22" fill="#e2a33c" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="202.7" y="100" width="28.3" height="22" fill="#1f3a93" stroke="#1a2233" stroke-opacity=".5"/>
      <text x="238" y="115" font-weight="600">3.5 s</text>
      <text x="282" y="115" font-size="10" fill-opacity=".8">clip 0.3 · warp 0.6 · resample 0.4 · compress 0.7 · mask + score 1.2</text>
    </g>

    <!-- Row 3: Bootstrap no pre-clip: uniform 23.1, pwb .84, mask 29.0, sampling 11.4 = 64.3 -->
    <text x="190" y="172" text-anchor="end" font-weight="600">Bootstrap</text>
    <text x="190" y="187" text-anchor="end" font-size="11" fill-opacity=".7">without pre-clip</text>
    <g>
      <rect x="200" y="160" width="204.6" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="404.6" y="160" width="7.4" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="412" y="160" width="256.9" height="22" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="668.9" y="160" width="101" height="22" fill="#1f3a93" fill-opacity=".55" stroke="#1a2233" stroke-opacity=".5"/>
      <text x="302" y="175" font-size="10" text-anchor="middle">warp + resample + compress 23</text>
      <text x="540" y="175" font-size="10" text-anchor="middle">mask + score 29</text>
      <text x="719" y="175" font-size="10" text-anchor="middle">sampling 11</text>
      <text x="776" y="175" font-weight="600">65 s</text>
    </g>

    <!-- Row 4: Bootstrap web: clip .31, uniform 1.45, pwb .36, mask 1.21, sampling 13.3 = 16.6 -->
    <text x="190" y="218" text-anchor="end" font-weight="600">Bootstrap</text>
    <text x="190" y="233" text-anchor="end" font-size="11" fill-opacity=".7">web app (pre-clip)</text>
    <g>
      <rect x="200" y="206" width="2.7" height="22" fill="#e2a33c" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="202.7" y="206" width="26.8" height="22" fill="#1f3a93" stroke="#1a2233" stroke-opacity=".5"/>
      <rect x="229.5" y="206" width="117.8" height="22" fill="#1f3a93" fill-opacity=".55" stroke="#1a2233" stroke-opacity=".5"/>
      <text x="288" y="221" font-size="10" text-anchor="middle">sampling 13</text>
      <text x="353" y="221" font-weight="600">17 s</text>
    </g>

    <!-- legend -->
    <g font-size="11">
      <rect x="200" y="284" width="12" height="12" fill="#e2a33c" stroke="#1a2233" stroke-opacity=".5"/><text x="217" y="294">pre-clip (web only)</text>
      <rect x="340" y="284" width="12" height="12" fill="#b8c2d6" stroke="#1a2233" stroke-opacity=".5"/><text x="357" y="294">fimeval on the full candidate</text>
      <rect x="540" y="284" width="12" height="12" fill="#1f3a93" stroke="#1a2233" stroke-opacity=".5"/><text x="557" y="294">fimeval on the clipped candidate</text>
    </g>
  </g>
</svg>