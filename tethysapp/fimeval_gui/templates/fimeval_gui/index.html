{% load static tethys %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ tethys_app.name }}</title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/x-icon"
          href="{% static 'fimeval_gui/favicon.ico' %}">

    <!-- React CSS bundle -->
    <link rel="stylesheet"
          href="{% static tethys_app|public:'frontend/main.css' %}">
  </head>

  <body style="margin: 0;">
    <div id="root"></div>

    <!-- Static images base, resolved by static so the React app loads images
         from S3/CDN in prod instead of a dead /static/ path on the app domain -->
    <script>
      window.STATIC_IMAGES_BASE = "{% static tethys_app|public:'images/' %}";
    </script>

    <!-- React JS bundle -->
    <script type="module"
            src="{% static tethys_app|public:'frontend/main.js' %}">
    </script>
  </body>
</html>
