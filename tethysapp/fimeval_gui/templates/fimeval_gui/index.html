{% load static tethys %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ tethys_app.name }}</title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/x-icon"
          href="{% static 'fimeval_gui/favicon.ico' %}">

    <!-- React CSS bundle -->
    <link rel="stylesheet"
          href="{% static tethys_app|public:'frontend/main.css' %}">
  </head>

  <body style="margin: 0;">
    {# FE56: the SPA reads the signed-in user's name for the sidebar's "Signed in as" label. #}
    <div id="root" data-username="{{ request.user.username }}"></div>

    <!-- React JS bundle -->
    <script type="module"
            src="{% static tethys_app|public:'frontend/main.js' %}">
    </script>
  </body>
</html>
